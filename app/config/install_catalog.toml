# AUTO-GENERATED copy of install/catalog.toml shipped with the
# backend. Do not edit by hand — re-run
# `python install/scripts/build_catalog.py`.
# Source SHA-256: 918c3655f0cf44a166d84e0964d05463ea9d0d2de58f3d5bce1c0b736879f81a

# Cremind install/setup catalog — single source of truth.
#
# Defines the user-facing labels, descriptions, and conditional rules
# shared by every consumer of the install/setup flow:
#
#   - install.sh     (POSIX shell, via the generated _catalog.sh include)
#   - install.ps1    (PowerShell, via the generated _catalog.ps1 include)
#   - SetupWizard.vue + DeploymentModeRadio.vue (via the
#                    /api/config/install-catalog endpoint)
#   - app/api/features.py (mode-rule filtering of service capabilities)
#
# When this file changes, regenerate the language-specific includes:
#
#   python install/scripts/build_catalog.py
#
# CI runs the same script with --check to fail when the master and
# generated outputs diverge.
#
# The setup-wizard environment presets ("local" / "docker" / "server")
# stay in app/config/setup_profiles.toml — that file is unchanged. This
# catalog only describes the install/runtime knobs (deployments, modes,
# rules); the API stitches both together when the wizard mounts.

schema_version = 1


# ── Deployments ──────────────────────────────────────────────────────────
# How Cremind listens for connections and is reached from a browser.
# Asked once during install (and shown in the Electron installer stage).
# Each entry maps to a ENV / HOST / APP_URL / CORS shape in the rendered
# .env file. Order keys are integers so the install scripts can render
# numbered prompts deterministically.

[deployments.local]
label       = "Local"
short       = "this machine only"
description = "bind to 127.0.0.1, only this machine can reach it"
env_value   = "local"
host        = "127.0.0.1"
requires_host = false
order       = 10

[deployments.server]
label       = "Server"
short       = "reachable from other devices"
description = "bind to all interfaces, reachable from other devices"
env_value   = "production"
host        = "0.0.0.0"
requires_host = true
order       = 20

[deployments.custom]
label       = "Custom (advanced)"
short       = "I'll configure host, URL, and CORS myself"
description = "advanced setup — choose where Cremind listens and how it's reached"
env_value   = "custom"
order       = 30

# Advanced fields shown only when the user picks `custom`. Each one
# carries a plain-English prompt and hint; the installer reads the
# answers and writes them into the rendered .env (the comment after
# `key` notes which env var receives the value). Order matters: the
# install scripts iterate this array in order.

[[deployments.custom.advanced_fields]]
key        = "listen_host"                # → HOST
prompt     = "Where should Cremind listen for connections?"
hint       = "Use 127.0.0.1 to only allow this machine, or 0.0.0.0 to allow other devices / containers on the network."
default    = "0.0.0.0"

[[deployments.custom.advanced_fields]]
key        = "public_url"                 # → APP_URL
prompt     = "What URL will you use to open Cremind in a browser?"
hint       = "This is the address users type into their browser. Inside a container it's usually http://localhost:1515. On a server it might be http://my-box.lan:1515 or https://cremind.example.com."
default    = "http://localhost:1515"

[[deployments.custom.advanced_fields]]
key        = "allowed_origins"            # → CORS_ALLOWED_ORIGINS
prompt     = "Which web origins should be allowed to talk to the API?"
hint       = "A comma-separated list of URLs the browser UI will be served from. Usually the same as the public URL above. Leave blank to use the public URL plus localhost variants."
default    = ""

[[deployments.custom.advanced_fields]]
key        = "wizard_preset"              # → SETUP_WIZARD_ENV
prompt     = "Which preset should pre-fill the Setup Wizard?"
hint       = "Presets fill in sensible defaults for the next setup screens — you can always edit any field afterwards. Pick `local` for a single-machine setup, `docker` for a docker-compose stack, or `server` for an external Postgres/Qdrant."
choices    = ["local", "docker", "server"]
default    = "local"


# ── Install modes ────────────────────────────────────────────────────────
# How Cremind itself is installed. Asked once during install. Maps to
# `INSTALL_MODE` in the rendered .env so the backend can apply the
# service-mode rules below without re-deriving it from `ENV`.
#
# Recommendation algorithm (shared by install.sh, install.ps1, and the
# Setup Wizard): walk modes in `order` ascending, pick the first whose
# `requires` capabilities are all satisfied in the current environment.
# This makes recommendation purely catalog-driven — there is no
# hardcoded "Docker by default" or "Native for dev channel" anywhere
# in code.

[modes.docker]
label       = "Docker"
description = "sandboxed container with a bundled storage stack (optional VNC desktop)"
hint        = "The agent runs inside a container. You can add a VNC desktop so it has its own GUI (observe at http://<host>:6080/vnc.html), or install the smaller headless image."
badge       = "recommended"
requires    = ["docker"]
order       = 10

[modes.native]
label       = "Native"
description = "Python venv at ~/.cremind/venv with embedded storage"
hint        = "Simpler, but the agent shares your desktop and home directory."
requires    = []
order       = 20

[modes.kubernetes]
label       = "Kubernetes"
description = "Helm release in an existing cluster (in-cluster Postgres, optional VNC desktop)"
hint        = "Installs the cremind Helm chart into a kubeconfig context you pick. Needs kubectl and helm on PATH; you reach Cremind through a kubectl port-forward at http://localhost:1515."
requires    = ["kubectl", "helm"]
order       = 30

# `requires` is a visibility gate, not documentation. Every front-end
# (install.sh, install.ps1, the installer TUI, the Electron installer stage)
# probes the capabilities it knows — `docker` (daemon reachable), `kubectl`
# (on PATH with at least one kubeconfig context), `helm` (helm 3 on PATH) —
# and only OFFERS a mode whose requirements are all met. A front-end that
# cannot probe a capability treats it as unmet, which is why the Electron
# installer (docker only) never lists Kubernetes. When exactly one mode
# survives it is selected without a prompt; `native` declares no requirements
# so that fallback always exists. The recommendation is the first surviving
# mode by `order` — there is no hardcoded "Docker by default" anywhere.
#
# Kubernetes is therefore invisible on a laptop without kubectl+helm. Note it
# is *also* a rule-only mode for the pod: the Helm chart sets
# INSTALL_MODE=kubernetes there, and [mode_rules.kubernetes] below constrains
# the Setup Wizard regardless of how the release was installed.


# ── Docker desktop UI sub-question ─────────────────────────────────────────
# Asked once, only when the install mode is Docker: whether to include the
# VNC Desktop UI. "Yes" pulls cremind/cremind-desktop (XFCE + VNC); "No"
# pulls the smaller headless cremind/cremind image. The default is Yes
# everywhere, including --unattended. Consumed by install.sh / install.ps1,
# the installer TUI, and the Setup Wizard's Docker option.

[docker_desktop]
prompt  = "Install the VNC Desktop UI?"
hint    = "Adds an XFCE desktop inside the container so you can watch the agent work at http://<host>:6080/vnc.html. Answer No to install the smaller headless image (cremind/cremind)."
default = true


# ── VNC password ───────────────────────────────────────────────────────────
# Asked right after [docker_desktop], and only when the answer was Yes: the
# password that unlocks the desktop at http://<host>:6080/vnc.html. Entered
# twice (entry + confirmation) in every interactive front-end.
#
# The 6-8 length is VNC's, not ours: TigerVNC's vncpasswd rejects anything
# shorter than 6, and the classic VNC DES scheme only keys off the first 8
# characters — a longer password would silently be truncated, so we cap it
# instead of pretending. The charset is what survives every hop the value
# takes: install.sh renders the template with `sed s|__VNC_PASSWORD__|...|g`,
# install.ps1 with -replace, and the value then sits unquoted in a compose
# .env and inside a TOML basic string in credentials.toml.
#
# Non-interactive installs (--unattended, no TTY) never prompt: they take
# --vnc-password if given, else keep the previous install's password, else
# generate one and print it at the end.

[vnc_password]
prompt = "Choose a password for the VNC Desktop"
hint   = "6-8 characters, from letters, digits and @ % _ + = : , . - — VNC ignores anything past the 8th character. You will sign in with it at http://<host>:6080/vnc.html. Leave empty when re-installing to keep the current password."


# ── Kubernetes prompts ─────────────────────────────────────────────────────
# Asked only when the install mode is kubernetes, in this order: context,
# namespace, (desktop / VNC password / HTTPS — shared with the Docker mode),
# then an "advanced options" gate that either applies every default below or
# walks the advanced_fields one by one. The TUI writes each answer as
# K8S_<key>; the shells expose the same values via --k8s-<key> / -K8s<Key>
# flags. release_name deliberately has a non-empty default: a non-empty
# K8S_release_name is how the shells know the gate has already been answered.
#
# The context question has no `choices` here because its options are probed at
# run time (kubectl config get-contexts), not declared in this file.

[kubernetes]
context_prompt    = "Which kubeconfig context should Cremind be installed into?"
context_hint      = "Every helm and kubectl command runs with --kube-context set to this choice (and --kubeconfig, for a context from a file kubectl does not read on its own), never the ambient current-context. Every kubeconfig under ~/.kube is listed, not just kubectl's own; each row shows the API server, and its file when several are in play, so a look-alike cluster stands out."
namespace_prompt  = "Which namespace should the Helm release go into?"
namespace_hint    = "Created if it does not exist. Lowercase letters, digits and hyphens, up to 63 characters."
namespace_default = "cremind"
advanced_prompt   = "Use the recommended Helm options, or customize them?"
advanced_hint     = "Recommended: release name cremind, app URL derived from the port-forward, the legacy Bitnami Postgres image, Postgres data kept on uninstall, no extra --set values."

[[kubernetes.advanced_fields]]
key     = "release_name"                  # → the helm release name
prompt  = "What should the Helm release be called?"
hint    = "Shown by helm list. Objects are named after it (a name containing cremind is used as-is, otherwise -cremind is appended). Lowercase letters, digits and hyphens, up to 53 characters."
default = "cremind"

[[kubernetes.advanced_fields]]
key     = "app_url"                       # → cremind.appUrl
prompt  = "What URL will you use to open Cremind in a browser?"
hint    = "Leave blank to let the chart derive it from the port-forward (http://localhost:1515, or https:// when HTTPS is on). Set it only when an ingress or load balancer serves Cremind at another address."
default = ""

[[kubernetes.advanced_fields]]
key     = "legacy_postgres_image"         # → postgresql.image.registry/repository
prompt  = "Use the legacy Bitnami Postgres image (docker.io/bitnamilegacy/postgresql)?"
hint    = "Bitnami moved its free images to the bitnamilegacy namespace, so the chart's default Postgres image no longer resolves on Docker Hub. Answer no only if your cluster mirrors the current Bitnami catalog."
choices = ["yes", "no"]
default = "yes"

[[kubernetes.advanced_fields]]
key     = "delete_postgres_data"          # → postgresql.primary.persistentVolumeClaimRetentionPolicy
prompt  = "Delete the Postgres volume when the release is uninstalled?"
hint    = "no keeps the data-cremind-postgresql-0 claim after helm uninstall (the chart default) so a reinstall picks the data back up; yes sets the retention policy to Delete."
choices = ["yes", "no"]
default = "no"

[[kubernetes.advanced_fields]]
key     = "extra_set"                     # → appended verbatim as one trailing --set
prompt  = "Any extra --set values for helm?"
hint    = "The value of one helm --set, e.g. ingress.enabled=true,ingress.host=cremind.example.com. Applied last, so it overrides the installer's own values. Leave blank for none."
default = ""


# ── Mode rules ───────────────────────────────────────────────────────────
# Per-install-mode visibility rules for each backing service's
# deployment_mode picker (Postgres / Qdrant / Chroma). The Setup Wizard's
# DeploymentModeRadio filters its options against
# `allowed_service_modes[INSTALL_MODE]`; the backend's
# /api/services/capabilities applies the same filter server-side so
# advanced users can't submit a hidden combination.
#
#   Docker  install: services may run via Docker (compose sidecar) or
#                    Native (in-process); External is hidden because the
#                    target audience doesn't see questions about
#                    pg_hba.conf, firewalls, or remote-host networking.
#   Native  install: services may run via Native (in-process) or External
#                    (user-supplied endpoint); Docker is hidden because
#                    there's no compose project to start a sidecar in.
#   Custom  install: all three modes visible — the user is in advanced
#                    mode and knows what they're doing.

[mode_rules.docker]
allowed_service_modes = ["docker", "native"]
default_service_mode  = "docker"

[mode_rules.native]
allowed_service_modes = ["native", "external"]
default_service_mode  = "external"

[mode_rules.custom]
allowed_service_modes = ["docker", "native", "external"]
default_service_mode  = "external"

# Kubernetes. Every backing service (Postgres / Qdrant / Chroma) must be a
# shared in-cluster service reached over its service DNS — never pod-local.
# Restricting to External-only drops Docker (no docker socket in a pod) and,
# critically, Chroma's Native mode (an in-process *persistent* local file that
# breaks horizontal scaling). The intersection in
# app/config/install_catalog.py:apply_mode_rule_to_services collapses each
# service's picker to the single External option.
[mode_rules.kubernetes]
allowed_service_modes = ["external"]
default_service_mode  = "external"


# ── Service modes ────────────────────────────────────────────────────────
# Labels and description templates for the per-service deployment_mode
# radio used by the Server and Embedding wizard steps. The
# `description_template` uses `{service}` as a placeholder; the
# DeploymentModeRadio component interpolates it with the service's
# display name (e.g. "Postgres", "Qdrant", "ChromaDB").

[service_modes.docker]
label                = "Docker"
description_template = "Cremind starts a {service} container alongside itself."

[service_modes.native]
label                = "Native"
description_template = "Cremind runs {service} locally (no extra container)."

[service_modes.external]
label                = "External"
description_template = "Connect to an existing {service} instance."
