# The one entry deliberately BELOW its published length. Meta's card advertises a
# 10M context, but vLLM's own Llama 4 guidance is that reaching it needs multiple
# nodes (tensor / pipeline parallel) because KV cache grows linearly with context
# and dominates memory past 1M tokens. 1,000,000 is the largest window a realistic
# single-node deployment serves; raise it only if you actually pass a bigger
# --max-model-len. Erring low only makes compaction fire early — erring high makes
# vLLM reject the request outright, so do not "correct" this upward to 10485760.
[[models]]
id = "meta-llama/Llama-4-Scout-17B-16E-Instruct"
context_window = 1000000
display_name = "Llama 4 Scout"
group_hint = "high"
prompt_cache = false
vision = true
input_price_per_1m = 0.00
output_price_per_1m = 0.00
