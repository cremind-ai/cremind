[provider]
name = "google-gemini"
display_name = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

[[provider.auth_methods]]
id = "api_key"
label = "Google Gemini API key"
hint = "AI Studio / Gemini API key"
instructions = "Enter your Gemini API key. Get one from https://aistudio.google.com/apikey"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Gemini API Key", type = "string", secret = true, required = true }

# Cache pricing: Gemini implicit caching (2.5+) bills cached input at 0.10x the
# input rate (90% discount) with no separate cache-write fee. Gemini's per-hour
# cached-token storage fee has no slot in this schema and is not modelled.
#
# Promotional pricing: the 3.6 / 3.7 / 3.8 Flash rates below are introductory
# and DOUBLE on 2027-01-01. Re-check this file in early January 2027 or those
# three entries silently report half the real cost.

[[models]]
id = "gemini-3.1-pro-preview"
context_window = 1048576
display_name = "Gemini 3.1 Pro"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
audio = true
input_price_per_1m = 2.00
output_price_per_1m = 12.00
reasoning_effort = ["low", "medium", "high"]
cache_read_price_per_1m = 0.20    # 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
id = "gemini-3.8-flash"
context_window = 1048576
display_name = "Gemini 3.8 Flash"
group_hint = "low"
supports_reasoning = true
prompt_cache = true
vision = true
audio = true
input_price_per_1m = 0.75         # promo rate; 1.50 from 2027-01-01
output_price_per_1m = 3.75        # promo rate; 7.50 from 2027-01-01
reasoning_effort = ["low", "medium", "high"]
cache_read_price_per_1m = 0.075   # 0.10x input; 0.15 from 2027-01-01
