# Context sources disagree on this one model: the catalog payload carries
# max_model_len 262144 but context_length 131072, while the pricing page says
# 131K and llms.txt says 128K. We take the lower figure — an over-stated window
# fails at the API, an under-stated one only leaves headroom unused.
