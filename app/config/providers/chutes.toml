[provider]
name = "chutes"
display_name = "Chutes"
base_url = "https://llm.chutes.ai/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Chutes API key"
hint = "Open-source models including Llama, Qwen, Kimi, and more"
instructions = "Chutes provides access to leading open-source models including Llama, Qwen, Kimi, and more. Get your API key at: https://chutes.ai/settings/api-keys"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Chutes API Key", type = "string", secret = true, required = true }

# The served catalog is now entirely confidential-compute: every id Chutes lists
# carries a "-TEE" suffix and reports confidential_compute=true. Select on that
# flag rather than on the name suffix, in case non-TEE chutes return later.
#
# Cache pricing: the OpenAI-compatible catalog (GET /v1/models) publishes a
# per-model `input_cache_read` rate, which is 0.10x input on every served model.
# There is no separate cache-write fee, and usage reports cache_creation as 0.

[[models]]
id = "moonshotai/Kimi-K3-TEE"
context_window = 1048576
display_name = "Kimi K3"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 3.00
output_price_per_1m = 15.00
cache_read_price_per_1m = 0.30    # 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
