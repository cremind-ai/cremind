# Removed 2026-09-06: meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8,
# Qwen/Qwen3-235B-A22B and moonshotai/Kimi-K2.5 were carried here pending a probe
# of the live endpoint. GET https://llm.chutes.ai/v1/models (the exact base_url
# above) now returns 14 chutes, every one of them "-TEE", and llms.txt agrees id
# for id; none of the three appears in either. They are non-selectable ids, not
# models with a pending shutdown date, so they are dropped rather than annotated.
# Chutes also serves unsloth/Mistral-Nemo-Instruct-2407-TEE and
# Nemotron-3-Nano-Omni-30B-TEE; both report context_length null (max_model_len
# 131072) and neither advertises reasoning, so they are left out deliberately.
