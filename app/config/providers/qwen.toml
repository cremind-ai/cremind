[provider]
name = "qwen"
display_name = "Qwen Cloud"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Standard API Key (Global)"
hint = "Endpoint: dashscope-intl.aliyuncs.com"
instructions = "Manage API keys: https://home.qwencloud.com/api-keys — Docs: https://docs.qwencloud.com/ — Uses the global endpoint at dashscope-intl.aliyuncs.com/compatible-mode/v1"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Qwen Cloud API Key", type = "string", secret = true, required = true }

[[provider.auth_methods]]
id = "api_key_cn"
label = "Standard API Key (China)"
hint = "Endpoint: dashscope.aliyuncs.com"
instructions = "Manage API keys: https://home.qwencloud.com/api-keys — Docs: https://docs.qwencloud.com/ — Uses the China endpoint at dashscope.aliyuncs.com/compatible-mode/v1"
kind = "api_key"

[provider.auth_methods.fields]
api_key = { description = "Qwen Cloud API Key", type = "string", secret = true, required = true }

# Currency: every rate below is USD, taken from the per-model pages on
# www.qwencloud.com, which price the international endpoint this provider points
# at. Qwen publishes CNY rates for the mainland console; none of those are used
# here, so no conversion is involved in any number in this file.
#
# max_output_tokens: every Qwen model publishes a "max input" cap BELOW its
# context window, so each entry carries a reserve that keeps
# context_window - max_output_tokens under that cap. The arithmetic is spelled
# out per entry; qwen-turbo, qwen3-235b-a22b and qwen3-32b need a reserve far
# larger than their 8K/16K real max output purely to respect the 98K input cap.
#
# Cache pricing: DashScope has TWO caches at two different rates. Cremind makes
# ordinary OpenAI-compatible calls, so it is served by the IMPLICIT cache, billed
# at 20% of the input rate (0.20x) — not the 10% explicit-cache-hit rate, which
# requires the explicit cache-point API Cremind never calls. Every cache_read
# below is the vendor's published implicit figure rather than a multiplier,
# because two models are cheaper than 0.20x (qwen3.8-max 0.125x, qwen3.8-flash
# ~0.11x). No cache-write fee applies on this path: explicit cache creation costs
# 1.25x input, but only via the explicit API.
#
# Thinking-mode pricing hazard: qwen-plus, qwen-turbo and qwen3-235b-a22b are
# hybrid models that bill thinking output at a large premium off the same input
# rate. The entries below carry the STANDARD non-thinking output rate, so any
# request that sets enable_thinking costs 2.5-3.3x what these figures predict.
# qwen3-32b prices thinking and non-thinking identically, and the 3.7/3.8-series
# entries publish a single blended rate, so those are safe.
#
# Tiered input pricing: qwen3-coder-plus is priced at its "<=32k" input band and
# qwen3.7-plus at its "<=256k" band. Longer prompts bill above these figures.

[[models]]
id = "qwen3.8-max"
context_window = 1000000
max_output_tokens = 131072    # 1,000,000 window − 131,072 reply = 868,928 max input (vendor cap 991K)
display_name = "Qwen3.8 Max"
group_hint = "high"
supports_reasoning = true
reasoning_effort = ["low", "medium", "xhigh"]   # vendor ladder is xhigh, not high
prompt_cache = true
vision = true
input_price_per_1m = 2.00
output_price_per_1m = 6.00
cache_read_price_per_1m = 0.25    # implicit cache, 0.125x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# List price recorded deliberately: the model page currently shows a 20%-off
# promotion with no end date ($0.32 / $1.28 / $0.064). A promo baked into a
# permanent catalog under-charges the moment it lapses.
[[models]]
id = "qwen3.7-plus"
context_window = 1000000
max_output_tokens = 65536     # 1,000,000 window − 65,536 reply = 934,464 max input (vendor cap 991K)
display_name = "Qwen3.7 Plus"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 0.40
output_price_per_1m = 1.60
cache_read_price_per_1m = 0.08    # implicit cache, 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
id = "qwen3.8-flash"
context_window = 1000000
max_output_tokens = 131072    # 1,000,000 window − 131,072 reply = 868,928 max input (cap is 991,808, or 983,616 in thinking mode)
display_name = "Qwen3.8 Flash"
group_hint = "low"
supports_reasoning = true
reasoning_effort = ["low", "medium", "xhigh"]   # same ladder as qwen3.8-max; "high"/"max" are remapped to xhigh
prompt_cache = true
vision = true
input_price_per_1m = 0.15
output_price_per_1m = 0.47
cache_read_price_per_1m = 0.016   # implicit cache, ~0.11x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# qwen-max is the 32K text-only alias; it is not Qwen3 Max. Vendor docs list it
# under "Legacy Models — Not Recommended", but it is still served and priced with
# no sunset notice, so it stays.
[[models]]
id = "qwen-max"
context_window = 32768
max_output_tokens = 8192      # 32,768 window − 8,192 reply = 24,576 max input (vendor cap 30K)
display_name = "Qwen-Max"
group_hint = "high"
supports_reasoning = false
prompt_cache = true
input_price_per_1m = 1.60
output_price_per_1m = 6.40
cache_read_price_per_1m = 0.32    # implicit cache, 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Thinking output is billed $4.00/1M against the $1.20 standard rate below.
[[models]]
id = "qwen-plus"
context_window = 1000000
max_output_tokens = 32768     # 1,000,000 window − 32,768 reply = 967,232 max input (vendor cap 995K)
display_name = "Qwen-Plus"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
input_price_per_1m = 0.40
output_price_per_1m = 1.20
cache_read_price_per_1m = 0.08    # implicit cache, 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Thinking output is billed $0.50/1M against the $0.20 standard rate below.
[[models]]
id = "qwen-turbo"
context_window = 131072
max_output_tokens = 33072     # 131,072 window − 33,072 reply = 98,000 max input (vendor cap 98K; the model's own max output is only 8,192)
display_name = "Qwen-Turbo"
group_hint = "low"
supports_reasoning = true
prompt_cache = true
input_price_per_1m = 0.05
output_price_per_1m = 0.20
cache_read_price_per_1m = 0.01    # implicit cache, 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Thinking output is billed $8.40/1M against the $2.80 standard rate below.
# Absent from both context-cache supported-model lists and its pricing table
# carries no cached-input row, so no cached rate is published for it.
[[models]]
id = "qwen3-235b-a22b"
context_window = 131072
max_output_tokens = 33072     # 131,072 window − 33,072 reply = 98,000 max input (vendor cap 98K; real max output is 8,192, or 16,384 thinking)
display_name = "Qwen 3 235B"
group_hint = "high"
supports_reasoning = true
prompt_cache = false
input_price_per_1m = 0.70
output_price_per_1m = 2.80

# Thinking and non-thinking are priced identically here, so no thinking premium.
# Absent from both context-cache supported-model lists; no cached rate published.
[[models]]
id = "qwen3-32b"
context_window = 131072
max_output_tokens = 33072     # 131,072 window − 33,072 reply = 98,000 max input (vendor cap 98K; real max output is 8,192)
display_name = "Qwen 3 32B"
group_hint = "low"
supports_reasoning = true
prompt_cache = false
input_price_per_1m = 0.16
output_price_per_1m = 0.64

# Sources disagree on this one: the context-cache guide lists qwen3-coder-plus
# under EXPLICIT cache support only, but its own model page publishes an
# "Input (Implicit Cache)" row at $0.20/1M. The model page wins — it is the
# model-specific source, and an explicit 0.20 beats the absent-field 0.50x
# fallback either way.
[[models]]
id = "qwen3-coder-plus"
context_window = 1000000
max_output_tokens = 65536     # 1,000,000 window − 65,536 reply = 934,464 max input (vendor cap 997K)
display_name = "Qwen3 Coder Plus"
group_hint = "high"
prompt_cache = true
input_price_per_1m = 1.00
output_price_per_1m = 5.00
cache_read_price_per_1m = 0.20    # implicit cache, 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Qwen Omni: multimodal model — accepts audio (and image) input alongside text
# via the `input_audio` content part in OpenAI-compatible chat completions.
# Prices below are the TEXT rates. Audio input is billed $3.81/1M (~9x), image
# and video input $0.78/1M, and text output with media input $3.06/1M (~1.8x),
# which this single-rate schema cannot express — audio turns will under-report
# cost. Absent from both context-cache lists and its pricing table has no
# cached-input row, so no cached rate is published.
#
# The vendor DOES publish this model's window — 64k context / 16k max output, in
# the vision-models guide — so the 65,536 below is sourced, not a guess. No max
# input cap is published, so max_output_tokens here is just the true reply cap.
# Qwen labels it a legacy model and steers new work to qwen3.5-omni-flash (256k
# context, 64k output), but publishes no shutdown date, so it stays.
[[models]]
id = "qwen3-omni-flash"
context_window = 65536
max_output_tokens = 16384     # vendor's published max output; leaves 49,152 for the prompt
display_name = "Qwen3 Omni Flash"
group_hint = "low"
supports_reasoning = true
prompt_cache = false
vision = true
audio = true
input_price_per_1m = 0.43
output_price_per_1m = 1.66
