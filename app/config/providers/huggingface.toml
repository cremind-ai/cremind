[provider]
name = "huggingface"
display_name = "Hugging Face"
base_url = "https://router.huggingface.co/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Hugging Face API key"
hint = "Inference API (HF token)"
instructions = "Enter your Hugging Face API key. Manage tokens at https://huggingface.co/settings/tokens"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Hugging Face Token", type = "string", secret = true, required = true }

# base_url is the Inference Providers router — the OpenAI drop-in replacement
# documented at huggingface.co/docs/inference-providers ("base_url=
# 'https://router.huggingface.co/v1'"), path suffix /v1 exactly. The legacy
# api-inference.huggingface.co host this file used to point at no longer resolves
# at all (no A record -> curl exit 6), so it is never a valid fallback.
#
# Hugging Face is a ROUTER, not a single backend: the same model id is served by
# up to eleven providers at different rates AND different context windows, and a
# bare id (no ":<provider>" / ":cheapest" / ":preferred" suffix) resolves to the
# `:fastest` provider — "our system automatically selects the fastest available
# provider for the specified model (equivalent to the `:fastest` policy — highest
# throughput in tokens per second)". So every price below is that fastest
# provider's published rate from GET https://router.huggingface.co/v1/models,
# which HF passes through with no markup. Pin an id (e.g.
# "openai/gpt-oss-120b:groq") if you need a rate that cannot drift.
#
# Context windows are the SERVED window, taking the lowest value across live
# providers where they disagree — an over-large window is a hard API failure,
# a too-small one only wastes headroom.
#
# Cache pricing: the router publishes no cached-token rate for any model — every
# `pricing` object in the whole catalog (138 models, re-checked 2026-09-06)
# carries exactly two keys, `input` and `output` — so every entry keeps
# prompt_cache = false and carries no cache_read/cache_write price rather than a
# guessed one. The 0.50x cache_read fallback in app/lib/llm/pricing.py never
# fires here: prompt_cache = false means no cached tokens are ever reported, so
# there is nothing for it to multiply. Do NOT "fix" that by writing
# cache_read_price_per_1m = 0.0 — that would assert cached reads are free, which
# is a stronger claim than the router makes.
#
# Tool-calling hazard: supports_tools varies BY PROVIDER for the same id. novita
# reports false for Qwen/Qwen3-235B-A22B, meta-llama/Llama-4-Scout-17B-16E-Instruct
# and openai/gpt-oss-20b, so a bare id can land on a backend that cannot call
# tools at all.

[[models]]
id = "moonshotai/Kimi-K3"
context_window = 1048576
display_name = "Kimi K3"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
vision = true
input_price_per_1m = 3.00
output_price_per_1m = 15.00
reasoning_effort = ["low", "high", "max"]

[[models]]
id = "zai-org/GLM-5.3"
context_window = 1048575          # together serves 1048575, one token under every other lane
display_name = "GLM-5.3"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
input_price_per_1m = 1.40
output_price_per_1m = 4.40
reasoning_effort = ["low", "high", "max"]

[[models]]
id = "deepseek-ai/DeepSeek-V4-Pro-0813"
context_window = 1048576
display_name = "DeepSeek V4 Pro"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
input_price_per_1m = 1.32
output_price_per_1m = 3.96
reasoning_effort = ["low", "high", "max"]

# Qwen3.5 exposes thinking as a boolean (enable_thinking, on by default), not as
# named effort levels — hence supports_reasoning without a reasoning_effort list.
[[models]]
id = "Qwen/Qwen3.5-397B-A17B"
context_window = 262144           # native window; the 1,010,000 YaRN extension is served by nobody
display_name = "Qwen 3.5 397B"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
vision = true
input_price_per_1m = 0.71
output_price_per_1m = 4.25

# MiniMax M3 controls thinking through a `thinking` parameter (enabled/adaptive/
# disabled) — modes, not an effort scale, so no reasoning_effort list.
[[models]]
id = "MiniMaxAI/MiniMax-M3"
context_window = 512000           # fireworks-ai's floor; others serve 524288-1000000
display_name = "MiniMax M3"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
vision = true
input_price_per_1m = 0.30
output_price_per_1m = 1.20

[[models]]
id = "openai/gpt-oss-120b"
context_window = 128072           # baseten's floor; every other provider serves 131072
display_name = "GPT-OSS 120B"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
input_price_per_1m = 0.35
output_price_per_1m = 0.75
reasoning_effort = ["low", "medium", "high"]

[[models]]
