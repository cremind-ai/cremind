# MiniMax M3: thinking is an on/off toggle at request time (no effort levels
# published), so supports_reasoning is set but reasoning_effort is omitted.
# Context is exactly 512000, not 524288. Calls whose input exceeds 512K tokens
# bill at a higher long-context rate that is not modelled here.
[[models]]
id = "accounts/fireworks/models/minimax-m3"
context_window = 512000
display_name = "MiniMax M3"
supports_reasoning = true
group_hint = "low"
prompt_cache = true
input_price_per_1m = 0.30
output_price_per_1m = 1.20
cache_read_price_per_1m = 0.06    # 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# The three entries below are NOT reachable over the serverless base_url above:
# each Fireworks model page now reports "Serverless: Not supported" (on-demand /
# dedicated GPUs only) and no serverless rate is published for them any more, so
# the prices they still carry are unverifiable. They are kept because Fireworks
# has published no deprecation notice for them -- their pages still read "Ready"
# and they appear in no changelog deprecation entry. Decide whether to drop them.
#
# Re-checked live 2026-09-06: all three model pages still say "Serverless: Not
# supported" and state "Ready" with no shutdown date, and none of them appears in
# the serverless pricing table (fireworks.ai/pricing now carries only embeddings
# rows and defers text pricing to docs.fireworks.ai/serverless/pricing, which does
# not list them). So Fireworks publishes NO cached-input rate for any of them, and
# the cache_read_price_per_1m = 0.50x values they used to carry were invented, not
# quoted. Those fields are removed and prompt_cache = false replaces them, which is
# how this catalog already records "no cached-input rate published" elsewhere.
# The input/output prices below are likewise no longer quotable from a live page
# (only Llama 4 Scout's page still echoes $0.15 / $0.60); they are left untouched
# rather than guessed at, and these endpoints are unreachable over the serverless
# base_url anyway.

[[models]]
id = "accounts/fireworks/models/llama4-maverick-instruct-basic"
context_window = 1048576
display_name = "Llama 4 Maverick"
group_hint = "high"
prompt_cache = false              # no cached-input rate published; all input bills at standard
vision = true
input_price_per_1m = 0.22
output_price_per_1m = 0.88

[[models]]
