[provider]
name = "fireworks"
display_name = "Fireworks AI"
base_url = "https://api.fireworks.ai/inference/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Fireworks API key"
hint = "API key"
instructions = "Enter your Fireworks API key. Manage keys at https://fireworks.ai/account/api-keys"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Fireworks API Key", type = "string", secret = true, required = true }

# Cache pricing: Fireworks publishes a per-model "Cached Input" rate on its
# serverless pricing page -- there is no flat discount. Observed ratios range
# from 0.032x input (DeepSeek V4 Flash/Pro) through 0.10x (Kimi K3, GPT OSS
# 120B) up to 0.20x (Kimi K2.7 Code, GLM 5.3 Flash, Qwen 3.7 Plus, MiniMax M3);
# nothing sits at the 0.50x fallback, so every model that HAS a published rate
# sets cache_read_price_per_1m explicitly. DeepSeek V4 Flash's $0.007 is not a
# decimal slip -- the table reads "$0.22 / $0.007 / $0.66" verbatim, and the
# priority tier scales it consistently to "$0.275 / $0.00875 / $0.825"
# (re-verified 2026-09-06). The models with NO published rate -- the three
# non-serverless legacy entries at the bottom -- carry prompt_cache = false
# instead of an invented number. There is still no separate cache-write fee, so
# cache_write_price_per_1m = 0.0 wherever caching applies.
# Prices below are the Standard serverless tier (Priority / Fast / US-pinned
# SKUs cost more and are not used).

[[models]]
id = "accounts/fireworks/models/kimi-k3"
context_window = 1048576
display_name = "Kimi K3"
group_hint = "high"
prompt_cache = true
vision = true
input_price_per_1m = 3.00
output_price_per_1m = 15.00
cache_read_price_per_1m = 0.30    # 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
