# ── ChatGPT Codex-only models (auth_method = codex_oauth) ──────────────────
# Served by https://chatgpt.com/backend-api/codex/responses under the signed-in
# user's ChatGPT plan, NOT api.openai.com. Reached only when the OpenAI
# provider's active auth method is "Sign in with ChatGPT". Usage is covered by
# the plan, so there is NO per-token billing: price fields are intentionally
# ABSENT (cost = unknown, never a misleading $0.00 — see app/lib/llm/pricing.py
# "never silently zero"). The GPT-6 / GPT-5.6 / GPT-5.5 models above are now
# served on BOTH paths and so live in the priced section instead; this block is
# what the Codex backend serves and the API does not.

# Availability is narrower than the codex_oauth hint implies: this is a
# text-only research preview limited to ChatGPT Pro accounts, so a Plus or Team
# user who picks it will be rejected by the backend. Its context window and max
# output are not published anywhere — the values below are conservative
# placeholders and the reasoning loop's clip-and-retry self-corrects if they are
# off.
[[models]]
id = "gpt-5.3-codex-spark"
display_name = "GPT 5.3 Codex Spark"
context_window = 272000
max_output_tokens = 128000
group_hint = "low"
supports_reasoning = true
reasoning_effort = ["low", "medium", "high"]
prompt_cache = true
vision = false
auth_methods = ["codex_oauth"]
