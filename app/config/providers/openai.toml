# ── Reasoning models (o-series) ────────────────────────────────────────────
# Every model in this block has an announced shutdown date that is still in the
# FUTURE as of 2026-09-06, so all four remain served and remain listed. Dates
# from developers.openai.com/api/docs/deprecations (re-checked 2026-09-06):
#   o3-pro   2026-12-11  snapshot o3-pro-2025-06-10 → gpt-5.6-sol (reasoning.mode: pro)
#   o3       2026-12-11  snapshot o3-2025-04-16     → gpt-5.6-sol
#   o4-mini  2026-10-23                             → gpt-5.6-terra
#   o3-mini  2026-10-23                             → gpt-5.6-sol
# All four publish a 200,000 context window and 100,000 max output tokens, with
# NO separate max-input cap. max_output_tokens is therefore deliberately absent:
# nothing here can build a prompt the API rejects, so compaction's 8,000 default
# reserve is safe. It is merely small relative to the 100,000 these models may
# emit — a reserve-tuning question, not a hard cap, so it is left alone.

# Shutdown 2026-12-11. RESPONSES-API-ONLY — LISTED BUT NOT INVOCABLE on the
