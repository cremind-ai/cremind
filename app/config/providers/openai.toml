# Audio-input model: accepts spoken audio (plus text) in chat completions via
# the OpenAI `input_audio` content part. Text/audio only — not a vision model.
# COST CAVEAT: the rates below are the TEXT token rates. Audio tokens bill
# separately at $32.00 in / $64.00 out per 1M (12.8x and 6.4x the text rates) and
# this schema has no second token class, so an audio-heavy turn is materially
# under-costed. No cached-input rate is published for either token class, so
# prompt_cache / cache_read_price_per_1m are deliberately omitted.
[[models]]
id = "gpt-audio-1.5"
display_name = "GPT Audio 1.5"
auth_methods = ["api_key"]
context_window = 128000
max_output_tokens = 16384
group_hint = "low"
audio = true
input_price_per_1m = 2.50
output_price_per_1m = 10.00
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Shutdown 2027-01-20 (announced 2026-07-20; substitute: gpt-audio-1.5 above).
# The date is in the future, so the previous-generation audio model is still
# served and stays listed. Chat Completions is its ONLY supported endpoint, so
# unlike the Pro entries it is genuinely invocable on the api_key path.
# Same COST CAVEAT as gpt-audio-1.5: the rates below are TEXT tokens. Audio
# tokens bill separately at $32.00 in / $64.00 out per 1M and this schema has no
# second token class, so an audio-heavy turn is materially under-costed. OpenAI
# publishes an em dash in this model's cached-input column, so cache_read is set
# equal to input per the convention noted at the top of this file.
[[models]]
id = "gpt-audio"
display_name = "GPT Audio"
auth_methods = ["api_key"]
context_window = 128000
max_output_tokens = 16384
group_hint = "low"
prompt_cache = false
audio = true
input_price_per_1m = 2.50
output_price_per_1m = 10.00
cache_read_price_per_1m = 2.50    # no cached discount — cached reads bill at the full input rate
cache_write_price_per_1m = 0.0    # no separate cache-write fee

