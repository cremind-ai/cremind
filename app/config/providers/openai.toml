[provider]
name = "openai"
display_name = "OpenAI"
requires_api_key = true

[[provider.auth_methods]]
id = "api_key"
label = "API Key"
hint = "Standard OpenAI API key"
instructions = "Get your API key at https://platform.openai.com/api-keys — sign in and create a new secret key."
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "OpenAI API Key", type = "string", secret = true, required = true }

[[provider.auth_methods]]
id = "codex_oauth"
label = "Sign in with ChatGPT"
hint = "Browser sign-in with your ChatGPT account (Plus/Pro/Team)"
instructions = "Click Sign in with ChatGPT and approve access in your browser. OpenAI always redirects to localhost:1455, so Cremind listens there and stores the tokens automatically. Docker installs need that port published and Kubernetes installs need it port-forwarded (the sign-in panel spells out the exact command for your install); where neither is possible — an Ingress or any remote URL — paste the full redirect URL from your browser's address bar instead, or run 'cremind llm codex-oauth login' from your own machine. Requests then run against ChatGPT's Codex backend under your plan — a different model list from the API-key models."
kind = "oauth"
# No `fields` table: the browser flow captures the tokens; there is nothing to
# type. Tokens are stored server-side under ``openai.oauth_*`` keys.

# Cache pricing: the GPT-5.x and GPT-6 families discount cached input to 0.10x the
# input rate; GPT-4.1 and most of the o-series cache at 0.25x, with o3-mini the
# outlier at 0.50x. The Pro models and gpt-audio publish NO cached-input discount
# at all (OpenAI's pricing table prints an em dash in their cached column), so
# their cache_read_price_per_1m is set EQUAL to the input rate —
# omitting it would make pricing.py apply the conservative 0.50x OpenAI-family
# fallback and *under*-bill cached reads. Cremind's openai_usage_breakdown()
# always reports cache_creation as 0, so cache_write_price_per_1m = 0.0 is the
# correct (and, in practice, unreachable) write rate for every entry here.

# Announced shutdowns (developers.openai.com/api/docs/deprecations, re-checked
# 2026-09-06). Several entries below carry a "shutdown YYYY-MM-DD" note. A model
# whose shutdown date is still in the FUTURE is served today and stays listed:
# deleting it breaks every user pinned to it for no gain. Drop an entry only once
# its date has actually passed, and re-check this file as each date comes up.

# Long-context surcharge — NOT representable in this schema. Every GPT-5.4 /
# GPT-5.5 / GPT-5.6 / GPT-6 model reprices the WHOLE request at 2x input and 1.5x
# output once the prompt passes 272K input tokens. The rates below are the
# standard (<272K) tier. With context_window at 1,050,000 the compaction
# threshold (0.85 * window ≈ 892K) sits inside the 2x band, so a very long
# conversation is under-costed by roughly 2x on input. A real fix needs a
# tiered-price field in app/lib/llm/pricing.py.

# parallel_tool_calls: lets the model request several tool calls in one turn (the
# agent then runs the leaf calls concurrently). Defaults to true for unflagged
# models. The listed OpenAI models accept the request parameter under tool_choice
# "auto"; set it to false to opt out a model that rejects it.

# Latest flagship models (GPT-6 / GPT-5.6 / GPT-5.5). These are served by BOTH
# the standard API (api_key) and the ChatGPT Codex backend (codex_oauth), so they
# carry real per-token prices — unlike the plan-covered Codex-only block below.
[[models]]
id = "gpt-6-astra"
display_name = "GPT-6 Astra"
context_window = 1050000
max_output_tokens = 128000    # 1,050,000 window − 128,000 reply = 922,000 max input
group_hint = "high"
supports_reasoning = true
reasoning_effort = ["low", "medium", "high"]
prompt_cache = true
vision = true
auth_methods = ["api_key", "codex_oauth"]
input_price_per_1m = 10.00
output_price_per_1m = 50.00
cache_read_price_per_1m = 1.00    # 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

