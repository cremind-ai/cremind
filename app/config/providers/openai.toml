# RESPONSES-API-ONLY — LISTED BUT NOT INVOCABLE ON THE api_key PATH.
# GPT-5.4 Pro is served on v1/responses only. Verified 2026-09-06: the api_key
# runtime app/lib/llm/openai.py issues chat.completions.create at both of its
# request sites and has no Responses path at all; the only Responses translator
# under app/lib/llm/ is openai_codex.py, which targets the ChatGPT Codex backend
# (chatgpt.com/backend-api/codex/responses), not api.openai.com. Selecting this
# model therefore fails at request time.
# KNOWN INCONSISTENCY, deliberate: gpt-5.5-pro was left OUT of this catalog for
# exactly this defect, while this entry and o3-pro below are kept under the
# caveat. The split is not a judgement that these two work — it is that they
# predate this refresh and may already be selected in a live profile, and
# dropping a model a user is pinned to is the riskier change. Resolve all three
# the same way once app/lib/llm/openai.py grows a Responses path; until then do
# not add new Responses-only models here.
# Pro models publish no cached-input discount, hence prompt_cache = false and a
# cache_read rate equal to input.
[[models]]
id = "gpt-5.4-pro"
display_name = "GPT-5.4 Pro"
auth_methods = ["api_key"]
context_window = 1050000
max_output_tokens = 128000    # 1,050,000 window − 128,000 reply = 922,000 max input
group_hint = "high"
supports_reasoning = true
reasoning_effort = ["medium", "high"]
prompt_cache = false
vision = true
input_price_per_1m = 30.00
output_price_per_1m = 180.00
cache_read_price_per_1m = 30.00   # no cached discount — cached reads bill at the full input rate
cache_write_price_per_1m = 0.0    # no separate cache-write fee

