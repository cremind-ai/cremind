[provider]
name = "github-copilot"
display_name = "GitHub Copilot"
base_url = "https://api.githubcopilot.com"

[[provider.auth_methods]]
id = "device_code"
label = "GitHub Device Login"
hint = "Browser device-code flow"
instructions = "This will open a GitHub device login to authorize Copilot. Requires an active GitHub Copilot subscription."
kind = "device_code"
is_default = true

[[provider.auth_methods]]
id = "api_key"
label = "GitHub Token"
hint = "Use an existing GitHub token"
instructions = "Paste a GitHub personal access token or Copilot token. You can also set COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN environment variables."
kind = "api_key"

[provider.auth_methods.fields]
api_key = { description = "GitHub Token", type = "string", secret = true, required = true }

# ---------------------------------------------------------------------------
# Pricing basis (re-verified 2026-09-06 against GitHub's live docs source)
# ---------------------------------------------------------------------------
# Every rate below is GitHub's OWN published Copilot rate, copied row by row --
# not an upstream vendor list price. Source: the "Models and pricing for GitHub
# Copilot" reference (/copilot/reference/copilot-billing/models-and-pricing),
# generated from github/docs `data/tables/copilot/models-and-pricing.yml`, whose
# header reads "This file defines per-token pricing for AI models available in
# GitHub Copilot. Prices are per 1 million tokens." GitHub charges that table in
# AI credits at "1 AI credit = $0.01 USD", so the published figures are dollars
# per 1M tokens and drop straight into these fields.
#
# Premium-request MULTIPLIERS and a flat per-request price are NOT the basis
# here. Request-based billing became legacy on 2026-06-01 and now covers only
# Pro / Pro+ subscribers still on an existing annual plan
# (/copilot/reference/copilot-billing/request-based-billing-legacy/*); every
# other subscriber is on usage-based billing, which is per-token. GitHub Models
# -- the separately retired token-priced product -- is a different product and
# has no bearing on this transport.
#
# Some rates coincide with the upstream vendor's list price because GitHub
# resells at provider list pricing; several deliberately do not, which is the
# check that these came from GitHub and not from the vendor:
#   * the Gemini Flash rows are a GitHub promotion through 2026-12-31,
#   * Grok's cached input is 0.25x input, not the usual 0.10x,
#   * Claude Fable 5.1's cached input is 0.025x input, not 0.10x like Fable 5.
#
# Rates below are the STANDARD/Default tier. The OpenAI, Google and xAI rows
# also carry a Long-context tier (roughly 2x input, 1.5x output) that applies
# above the context_window recorded here, which this catalog does not use.
#
# cache_read_price_per_1m is GitHub's published "Cached Input" column, set
# explicitly so pricing.py's conservative 0.50x fallback does not over-estimate.
# cache_write_price_per_1m is 0.0 on every entry: "github-copilot" is not in
# pricing.py's _FAMILY_BY_PROVIDER, so it resolves to the OpenAI-compatible
# family, whose usage payload always reports cache_creation as 0 -- GitHub's
# published Anthropic cache-write rates ($12.50 Fable / $6.25 Opus / $3.75
# Sonnet 4.6 / $2.50 Sonnet 5 / $1.25 Haiku) would never be multiplied by a
# non-zero token count on this transport.
#
# ---------------------------------------------------------------------------
# Model ids, context windows, and what is deliberately absent
# ---------------------------------------------------------------------------
# GitHub documents model NAMES ("GPT-6 Astra") but publishes no API id strings
# and no context limits anywhere in its docs. Ids here come from, in order of
# preference:
#   1. github/gh-aw-firewall `src/copilot-model.ts` -- a GitHub-owned repo whose
#      SUPPORTED_COPILOT_MODELS set is documented as the "single source of truth
#      for all Copilot CLI completion models";
#   2. the models.dev `github-copilot` catalog (api=https://api.githubcopilot.com),
#      which is derived from the live /models response and is also the only
#      source for per-model context / max-input limits.
# A model whose id cannot be sourced from one of those is left out rather than
# guessed: a wrong id is a runtime 400, a missing one is only a gap.
#
# context_window is the Default pricing tier's boundary wherever GitHub
# publishes one (the OpenAI and xAI rows), because that is the boundary above
# which the recorded rate stops being the charged rate; otherwise it is the
# model's limit from models.dev. GitHub's 1M-token context is an opt-in extended
# capability scoped to "Visual Studio Code and Copilot CLI only" and reached
# through a separate id (e.g. the reported claude-opus-4.7-1m-internal), so the
# Claude 4.x rows record their 200K default rather than that 1M ceiling.
# max_output_tokens is set only where models.dev publishes a max-input cap below
# the context window, so that context_window - max_output_tokens never exceeds
# the input the API will accept.
#
# Documented-but-absent models, and why:
#   * gpt-5.3-codex, gpt-5.4-mini, gpt-5.6-luna, gpt-5.6-sol, gpt-5.6-terra --
#     reachable only on Copilot's /responses endpoint. GitHubCopilotLLMProvider
#     subclasses OpenAILLMProvider and only ever calls /chat/completions, which
#     answers `400 model "<id>" is not accessible via the /chat/completions
#     endpoint` for all five (github/copilot-cli#2177 and #4337; the gpt-5.4-mini
#     case is called out in github/gh-aw-firewall docs/model-api-mapping.json).
#   * gpt-6-astra -- the id is established, but nothing establishes that it
#     answers on /chat/completions, and every newer OpenAI model on Copilot that
#     has been tested does not. Needs one live probe before it is listed.
#   * Gemini 3.5 Flash, Gemini 3.6 Flash, Kimi K2.7 Code -- retired 2026-10-02;
#     MAI-Code-1-Flash -- retired 2026-09-10 (github.blog changelog 2026-09-03
#     and github/docs data/tables/copilot/model-deprecation-history.yml). Each is
#     superseded by a row listed below at the same or a lower rate, so they are
#     not worth adding weeks before they stop answering.
#   * GPT-5.4 nano -- "currently only available in the Codex Visual Studio Code
#     extension (Copilot Pro+ only) and is not available in Copilot Chat".
#   * Claude Fable 5 / 5.1 need an enterprise or organization administrator to
#     enable them explicitly, and Anthropic retains prompts and outputs for them
#     by default; they are listed, but expect a policy error on an account that
#     has not turned them on.

[[models]]
id = "gpt-5.5"
context_window = 272000
display_name = "GPT-5.5 (via Copilot)"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
vision = true
input_price_per_1m = 5.00
output_price_per_1m = 30.00
cache_read_price_per_1m = 0.50    # 0.10x input
cache_write_price_per_1m = 0.0    # no cache-creation reported

[[models]]
id = "gpt-5.4"
context_window = 272000
display_name = "GPT-5.4 (via Copilot)"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
vision = true
input_price_per_1m = 2.50
output_price_per_1m = 15.00
cache_read_price_per_1m = 0.25    # 0.10x input
cache_write_price_per_1m = 0.0    # no cache-creation reported

# GitHub's "Lightweight" OpenAI row and the cheapest chat-completions model on
# this transport. models.dev caps its input at 128K inside a 264K window, so the
# reply reserve is sized to hold the prompt at or below that cap.
[[models]]
id = "gpt-5-mini"
context_window = 264000
max_output_tokens = 136000
display_name = "GPT-5 mini (via Copilot)"
supports_reasoning = true
group_hint = "low"
prompt_cache = true
vision = true
input_price_per_1m = 0.25
output_price_per_1m = 2.00
cache_read_price_per_1m = 0.025   # 0.10x input
cache_write_price_per_1m = 0.0    # no cache-creation reported

