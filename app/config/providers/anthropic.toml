[provider]
name = "anthropic"
display_name = "Anthropic"

[[provider.auth_methods]]
id = "api_key"
label = "API Key"
hint = "Use your Anthropic API key"
instructions = "Get your API key at https://console.anthropic.com/settings/keys — sign in to the Anthropic Console and create a new API key."
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Anthropic API Key", type = "string", secret = true, required = true }

[[provider.auth_methods]]
id = "setup_token"
label = "Setup Token"
hint = "Use a setup/session token (Authorization: Bearer)"
instructions = "Paste your Anthropic setup-token. This is a bearer token for API access, distinct from a permanent API key. If you have the Claude CLI installed locally, using the API Key method is recommended instead. Setup tokens may have an expiration."
kind = "token"

[provider.auth_methods.fields]
setup_token = { description = "Setup Token", type = "string", secret = true, required = true }

# Cache pricing: Anthropic bills cache reads at 0.10x the input rate and 5-minute
# ephemeral cache writes at 1.25x the input rate. Exception: cache reads on Claude
# Fable 5.1 (and Mythos 5.1) are 0.025x the input rate — the write stays at 1.25x —
# so that read rate must be written explicitly or the 0.10x fallback bills 4x high.

# parallel_tool_calls: lets the model request several tool calls in one turn (the
# agent then runs the leaf calls concurrently). Defaults to true for unflagged
# models; set it to false only to opt a model out.

# max_output_tokens: tokens compaction holds back for the reply so the prompt can't
# crowd it out — the hard ceiling is context_window - max_output_tokens. Optional;
# models without it use a flat default (see DEFAULT_RESPONSE_RESERVE).

# Claude Fable 5.1
[[models]]
id = "claude-fable-5-1"
display_name = "Claude Fable 5.1"
context_window = 1000000
max_output_tokens = 16000
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 10.00
output_price_per_1m = 50.00
cache_read_price_per_1m = 0.25    # 0.025x input (Fable 5.1 exception)
cache_write_price_per_1m = 12.50  # 1.25x input (5-min ephemeral)

