[provider]
name = "nvidia"
display_name = "NVIDIA"
base_url = "https://integrate.api.nvidia.com/v1"

[[provider.auth_methods]]
id = "api_key"
label = "API Key"
hint = "Use your NVIDIA API key"
instructions = "Get your API key at https://build.nvidia.com — sign in with your NVIDIA account, navigate to any model, and generate an API key."
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "NVIDIA API Key", type = "string", secret = true, required = true }

# Pricing is 0.00 across the board on purpose, and that choice is a BET. State it
# plainly, because pricing.py cannot: _rates_from_catalog() decides the source
# with `source = "catalog" if input_per_1m is not None else "unknown"`, and a
# PRESENT 0.0 is not None. So every NVIDIA turn is reported as a confident
# source="catalog", total_usd = 0.00 — not an honest None/"unknown". The bet is
# that the hosted endpoint never starts billing; the day it does, Cremind keeps
# reporting exactly $0.00 with no signal that the number went stale. (Deleting
# the two price fields would flip the report to source="unknown" / total None,
# which is the honest-but-useless alternative; 0.00 is kept because free really
# is the published price today.)
#
# Re-verified against first-party sources on 2026-09-06 — the bet still holds:
#   * build.nvidia.com advertises "Free inference with leading models" and shows
#     no rates; there is no pricing page at all (build.nvidia.com/pricing 404s).
#   * developer.nvidia.com/nim offers Developer Program members "free access to
#     NIM API endpoints for unlimited prototyping, powered by DGX Cloud". Hosted
#     usage is metered as per-CALL credits under an RPM cap, never as tokens.
#   * The NIM FAQ (docs.api.nvidia.com/nim/docs/product) prices only the paid
#     SELF-HOSTED path — NVIDIA AI Enterprise licences "start at $4500 per GPU
#     per year or ~ $1 per GPU per hour in the cloud" — i.e. per GPU, not per
#     token, and not applicable to integrate.api.nvidia.com at all.
# Several third-party aggregators do publish per-token "NVIDIA NIM" rates. None
# of them cite an NVIDIA page, and NVIDIA contradicts them, so they are not used.
#
# Re-check trigger: the first time build.nvidia.com grows a pricing page or a
# paid pay-as-you-go tier, every entry below under-reports cost by 100%.
#
# No prompt-caching feature is documented for these OpenAI-compatible endpoints,
# so prompt_cache stays false and the cache rate fields are omitted (with input at
# 0.00 every multiplier fallback resolves to 0.0 anyway).
#
# context_window here is the max INPUT the hosted endpoint serves. Where NVIDIA
# publishes an exact "Input Context Length (ISL)" it is used verbatim; where the
# reference only says "1M" it is read as 1,048,576, which is how NVIDIA's own
# Nemotron 3 Ultra guide spells 1M ("a 1,048,576-token (1M) context window").

[[models]]
id = "nvidia/nemotron-3-ultra-550b-a55b"
context_window = 262144
display_name = "Nemotron 3 Ultra 550B"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
input_price_per_1m = 0.00
output_price_per_1m = 0.00

[[models]]
id = "nvidia/nemotron-3-super-120b-a12b"
context_window = 262144
display_name = "Nemotron 3 Super 120B"
supports_reasoning = true
group_hint = "high"
prompt_cache = false
input_price_per_1m = 0.00
output_price_per_1m = 0.00

# NVIDIA's NIM reference prints the exact figure — "Input Context Length (ISL):
# 1,000,000" — not a rounded 1M, so the served cap is 1,000,000 and NOT 1,048,576.
# At 1,048,576 compaction's 8,000-token default reserve leaves a 1,040,576-token
# prompt, 40,576 over the cap, and the endpoint rejects the request.
[[models]]
id = "deepseek-ai/deepseek-v4-pro-0813"
context_window = 1000000
display_name = "DeepSeek V4 Pro"
supports_reasoning = true
reasoning_effort = ["low", "high", "max"]   # NVIDIA's published set skips "medium"
group_hint = "high"
prompt_cache = false
input_price_per_1m = 0.00
output_price_per_1m = 0.00

# Same family, same doc set: the reference gives the ISL as "One million tokens"
# and its sibling above spells that out as 1,000,000, so 1,000,000 it is.
[[models]]
