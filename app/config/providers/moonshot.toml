[provider]
name = "moonshot"
display_name = "Moonshot AI (Kimi)"
base_url = "https://api.moonshot.ai/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Kimi API key (.ai)"
hint = "Kimi K2.5 + Kimi"
instructions = "Enter your Moonshot API key. Manage keys at the Moonshot AI platform."
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Moonshot API Key", type = "string", secret = true, required = true }

[[provider.auth_methods]]
id = "api_key_cn"
label = "Kimi API key (.cn)"
hint = "Kimi K2.5 + Kimi (China endpoint)"
instructions = "Enter your Moonshot API key for the .cn endpoint."
kind = "api_key"

[provider.auth_methods.fields]
api_key = { description = "Moonshot API Key", type = "string", secret = true, required = true }

# Cache pricing: Kimi context caching is automatic (no cache-create call, no
# write or storage fee). The cached-read rate is published per model as a
# "cache hit" input price and is NOT a uniform multiplier - it ranges from
# 0.10x input (K3) to 0.20x (K2.7 Code) - so each entry sets it explicitly.

[[models]]
id = "kimi-k3"
context_window = 1048576
display_name = "Kimi K3"
group_hint = "high"
supports_reasoning = true
reasoning_effort = ["low", "high", "max"]
prompt_cache = true
vision = true
input_price_per_1m = 3.00
output_price_per_1m = 15.00
cache_read_price_per_1m = 0.30    # 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# K2.7 Code always reasons and takes no reasoning_effort parameter (it uses a
# `thinking` object instead), so no effort array is listed.
[[models]]
id = "kimi-k2.7-code"
context_window = 262144
display_name = "Kimi K2.7 Code"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 0.95
output_price_per_1m = 4.00
cache_read_price_per_1m = 0.19    # 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Same model as kimi-k2.7-code with identical parameter constraints; only the
# output speed (~180-260 tok/s) and the price differ.
[[models]]
id = "kimi-k2.7-code-highspeed"
context_window = 262144
display_name = "Kimi K2.7 Code (High Speed)"
group_hint = "high"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 1.90
output_price_per_1m = 8.00
cache_read_price_per_1m = 0.38    # 0.20x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# General-purpose tier: the only current Kimi model whose thinking can be
# disabled, and it takes no reasoning_effort parameter.
[[models]]
id = "kimi-k2.6"
context_window = 262144
display_name = "Kimi K2.6"
group_hint = "low"
supports_reasoning = true
prompt_cache = true
vision = true
input_price_per_1m = 0.95
output_price_per_1m = 4.00
cache_read_price_per_1m = 0.16    # ~0.17x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee
