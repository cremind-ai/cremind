cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
id = "MiniMaxAI/MiniMax-M3"
context_window = 524288
display_name = "MiniMax M3"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
