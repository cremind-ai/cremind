# Retained, not refreshed. Checked live 2026-09-06: this exact id appears in
# neither Together's serverless-models table nor its pricing page, and the
# deprecation list retires only the different string "Qwen/Qwen3-235B-A22B"
# (inference removal 2026-06-29, fine-tuning 2026-07-29 -- both already past, so
# the keep-a-future-shutdown rule does not apply here either way). The one 235B
# row Together still prices is "Qwen3 235B A22B Instruct 2507 FP8 Throughput" at
# $0.20/$0.60, a different endpoint, so the $0.50/$1.50 below stays unverified
# rather than being overwritten with another model's rate.
# The former cache_read_price_per_1m = 0.25 is gone: it was a fabricated 0.50x
# carry-over, and Together publishes no cached-input column for ANY 235B variant.
# This entry now bills every input token at the standard rate, like the other
# prompt_cache = false rows here.
[[models]]
id = "Qwen/Qwen3-235B-A22B-FP8"
context_window = 262144
display_name = "Qwen 3 235B"
supports_reasoning = true
group_hint = "high"
prompt_cache = false              # no cached-input rate published; all input bills at standard
input_price_per_1m = 0.50
output_price_per_1m = 1.50

