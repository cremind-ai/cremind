# group_hint resolved to "high". Leaving it unset made this the only entry in the
# whole provider catalog with no tier, so its usage rows grouped under nothing on
# the dashboard. "low" is the wrong call: at $1.04/$1.04 it is ~7x the input price
# of the Flash models tagged "low" here, and the sibling catalogs reserve "low" for
# genuinely small models (vllm.toml tags Llama 3.1 8B "low"). The identical model at
# the identical $1.04/$1.04 and 131072 window is already tagged "high" in both
# huggingface.toml and vllm.toml, so "high" is what keeps the tier consistent
# across catalogs. Price and window re-verified 2026-09-06 on together.ai/pricing
# and the serverless-models table; the pricing row shows no cached-input column.
[[models]]
id = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
context_window = 131072
display_name = "Llama 3.3 70B Instruct Turbo"
group_hint = "high"
supports_reasoning = false
prompt_cache = false              # no cached-input rate published; all input bills at standard
input_price_per_1m = 1.04
output_price_per_1m = 1.04
