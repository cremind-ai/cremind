[provider]
name = "together"
display_name = "Together AI"
base_url = "https://api.together.xyz/v1"

[[provider.auth_methods]]
id = "api_key"
label = "Together AI API key"
hint = "API key"
instructions = "Enter your Together AI API key. Manage keys at https://api.together.xyz/settings/api-keys"
kind = "api_key"
is_default = true

[provider.auth_methods.fields]
api_key = { description = "Together AI API Key", type = "string", secret = true, required = true }

# Cache pricing: Together AI caches repeated prefixes automatically, but the
# cached-input rate is published PER MODEL — real ratios run ~0.10x-0.21x of
# input, never a flat 0.50x. Only models that publish a cached-input price
# support cached billing at all; the rest bill every input token at the standard
# rate and carry prompt_cache = false. No separate cache-write fee on any of them.

[[models]]
id = "moonshotai/Kimi-K3"
context_window = 1048576
display_name = "Kimi K3"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
vision = true
input_price_per_1m = 3.00
output_price_per_1m = 15.00
cache_read_price_per_1m = 0.30    # published rate, 0.10x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
id = "Qwen/Qwen3.8-2.4T-A95B"
context_window = 1000000
display_name = "Qwen3.8 Max"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
vision = true
input_price_per_1m = 2.00
output_price_per_1m = 6.00
reasoning_effort = ["low", "high", "xhigh"]
cache_read_price_per_1m = 0.25    # published rate, 0.125x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

# Context window is exactly 1048575 (2^20 - 1) on both GLM-5.3 rows -- that is the
# figure Together's serverless-models table publishes, not 1048576. The model page's
# "1M" is the rounded marketing number. Re-verified live 2026-09-06 against
# docs.together.ai/docs/serverless-models, where the neighbouring Kimi K3 and
# DeepSeek V4 rows do read 1048576, so the odd value is per-model, not a typo.
# Do not "round up" -- context_window is the hard ceiling compaction sizes against.
[[models]]
id = "zai-org/GLM-5.3"
context_window = 1048575
display_name = "GLM-5.3"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
input_price_per_1m = 1.40
output_price_per_1m = 4.40
reasoning_effort = ["low", "high", "max"]
cache_read_price_per_1m = 0.26    # published rate, ~0.19x input
cache_write_price_per_1m = 0.0    # no separate cache-write fee

[[models]]
id = "deepseek-ai/DeepSeek-V4-Pro-0813"
context_window = 1048576
display_name = "DeepSeek V4 Pro"
supports_reasoning = true
group_hint = "high"
prompt_cache = true
input_price_per_1m = 1.32
output_price_per_1m = 3.96
