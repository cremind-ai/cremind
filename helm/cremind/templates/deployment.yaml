{{- /* Hard single-pod guard: the image bundles a VNC desktop, so more than one
       pod means more than one independent desktop — not allowed. Reject any
       replicaCount other than 1 at render time. */ -}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Cremind bundles a VNC virtual desktop and must run as exactly ONE pod. replicaCount must be 1 — horizontal scaling is not supported (multiple pods would create multiple divergent desktops)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cremind.fullname" . }}
  labels:
    {{- include "cremind.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Always exactly one pod — see the single-pod guard above (VNC desktop).
  replicas: 1
  # RWO PVCs cannot multi-attach AND the single-VNC-desktop model forbids a
  # second pod; Recreate terminates the old pod before starting the new one,
  # so an upgrade never momentarily runs two. Never switch to RollingUpdate.
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cremind.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the env ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "cremind.sidecarEnabled" . }}
        # Same for the sidecar's config: a subPath mount never hot-reloads, so
        # without this an edit would sit unused until the next pod roll.
        checksum/proxy-config: {{ include (print $.Template.BasePath "/proxy-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cremind.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cremind.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cremind
          image: {{ include "cremind.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "cremind.fullname" . }}-env
          {{- /* Resolve the Secret that holds the Postgres password: an
                 explicit override, else the bundled subchart's Secret. */ -}}
          {{- $pgSecret := .Values.cremind.postgresPasswordSecret.name }}
          {{- if and (not $pgSecret) .Values.postgresql.enabled }}
          {{- $pgSecret = (.Values.postgresql.fullnameOverride | default (printf "%s-postgresql" (include "cremind.fullname" .))) }}
          {{- end }}
          {{- if or $pgSecret .Values.cremind.extraEnv }}
          env:
            {{- if $pgSecret }}
            # Auto-wire the PostgreSQL password from its Secret so the Setup
            # Wizard needs no manual credential entry — the backend falls back
            # to CREMIND_POSTGRES_PASSWORD when the wizard's password field is
            # left blank (the Compose-like "everything is wired" experience).
            # Server-side only via secretKeyRef — the value never reaches the
            # browser and never appears in the pod spec.
            - name: CREMIND_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret | quote }}
                  key: {{ .Values.cremind.postgresPasswordSecret.key | quote }}
            {{- end }}
            {{- with .Values.cremind.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # Container ports are informational; the proxy sidecar reaches these
          # over the shared pod loopback. The novnc (80) / vnc (5900) ports
          # exist only on the desktop flavor.
          ports:
            - name: api
              containerPort: {{ .Values.cremind.apiPort }}
            - name: ui
              containerPort: {{ .Values.cremind.uiPort }}
            # Transient Codex OAuth callback listener (bound only while a
            # "Sign in with ChatGPT" flow is pending). Declared so the Service's
            # codex-oauth port resolves for `kubectl port-forward svc/...`.
            - name: codex-oauth
              containerPort: {{ .Values.cremind.codexCallbackPort }}
            {{- if .Values.desktop.enabled }}
            - name: novnc
              containerPort: 80
            - name: vnc
              containerPort: 5900
            {{- end }}
          {{- /* Probe action, shared by both probes below.
                 ""          -> httpGet on plain HTTP.
                 auto        -> httpGet with scheme HTTPS (the app terminates
                                TLS from the very first boot; kubelet does not
                                verify the certificate, so the locally-signed
                                one is fine).
                 after-setup -> tcpSocket. This mode serves plain HTTP until
                                the Setup Wizard completes and https after the
                                restart, and NO httpGet is true in both phases:
                                scheme HTTPS fails against the http listener —
                                restart-looping the pod before setup can even
                                finish — and scheme HTTP fails after the flip.
                                A TCP connect to the port is the one check that
                                holds across it. */}}
          {{- $sslMode := include "cremind.sslMode" . }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if eq $sslMode "after-setup" }}
            tcpSocket:
              port: ui
            {{- else }}
            httpGet:
              path: /
              port: ui
              {{- if $sslMode }}
              scheme: HTTPS
              {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- /* Same two-phase reasoning as the readiness probe above. */}}
            {{- if eq $sslMode "after-setup" }}
            tcpSocket:
              port: ui
            {{- else }}
            httpGet:
              path: /
              port: ui
              {{- if $sslMode }}
              scheme: HTTPS
              {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.system.enabled }}
            - name: system
              mountPath: {{ .Values.cremind.systemDir }}
            {{- end }}
            {{- if .Values.persistence.venv.enabled }}
            # Persist the wizard-installed Python venv (LLM SDKs, embeddings) so
            # a rescheduled pod keeps working without re-running setup. The
            # entrypoint seeds this from the image baseline on first boot.
            - name: venv
              mountPath: /opt/cremind/venv
            {{- end }}
            {{- if .Values.persistence.work.enabled }}
            # Persist the agent's User Working Directory so files it creates
            # survive restarts. mountPath must match the wizard's working dir.
            - name: work
              mountPath: {{ .Values.persistence.work.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- $proxyOn := include "cremind.proxyEnabled" . }}
        {{- $relayOn := include "cremind.relayEnabled" . }}
        {{- if or $proxyOn $relayOn }}
        {{- if $proxyOn }}
        # Single entry point: nginx routes /api + /health -> backend, /vnc/ ->
        # noVNC, everything else -> the SPA, all on one port. Shares the pod
        # network namespace with the cremind container (reaches it on 127.0.0.1).
        {{- else }}
        # Layer-4 TCP relay: passes bytes through to the app's own listener
        # untouched (TLS stays end-to-end; see cremind.relayEnabled in
        # _helpers.tpl). Never restarts when the app container does, so a
        # kubectl port-forward survives the after-setup https flip and in-app
        # upgrades — kubectl >= 1.23 would otherwise kill the whole tunnel on
        # the first refused dial into the pod.
        {{- end }}
        - name: proxy
          image: "{{ .Values.proxy.image.registry }}/{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            {{- if $proxyOn }}
            - name: http
              containerPort: {{ .Values.proxy.port }}
            {{- else }}
            - name: relay
              containerPort: {{ .Values.proxy.port }}
            # Pod-internal only: carries /healthz for the probes below. Not on
            # the Service.
            - name: relay-admin
              containerPort: {{ .Values.proxy.adminPort | default 8081 }}
            {{- end }}
          {{- $probePort := ternary "http" "relay-admin" (ne $proxyOn "") }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $probePort }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $probePort }} }
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: proxy-config
              {{- if $proxyOn }}
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              {{- else }}
              # Full-file override: stream{} must be top-level, outside the
              # http{} context that conf.d is included into.
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              {{- end }}
        {{- end }}
      volumes:
        {{- if include "cremind.sidecarEnabled" . }}
        - name: proxy-config
          configMap:
            name: {{ include "cremind.fullname" . }}-proxy
        {{- end }}
        {{- if .Values.persistence.system.enabled }}
        - name: system
          persistentVolumeClaim:
            claimName: {{ include "cremind.systemClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.venv.enabled }}
        - name: venv
          persistentVolumeClaim:
            claimName: {{ include "cremind.venvClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.work.enabled }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "cremind.workClaimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
