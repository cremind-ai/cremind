{{- $proxyOn := include "cremind.proxyEnabled" . }}
{{- $relayOn := include "cremind.relayEnabled" . }}
{{- if or $proxyOn $relayOn }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cremind.fullname" . }}-proxy
  labels:
    {{- include "cremind.labels" . | nindent 4 }}
data:
{{- if $proxyOn }}
  default.conf: |
    # Single entry point for Cremind. The cremind container and this nginx
    # sidecar share the pod network namespace. The cremind app now serves the
    # SPA + API + A2A + OAuth as ONE single-origin app on 127.0.0.1:1515, so
    # nginx only needs to (a) carve out noVNC/websockify on :80 (desktop flavor
    # only) and (b) forward everything else to 1515. The internal API bind
    # (1112) is loopback-only and is NOT proxied here.

    # Standard WebSocket upgrade map (http context — conf.d is included there).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The public listener is also used by port-forward and LoadBalancer clients,
    # so it ignores client-supplied forwarding headers. The Ingress reaches a
    # different, ClusterIP-only listener; only that port accepts an exact
    # http/https scheme supplied by the controller. Unknown values fall back to
    # the real nginx connection scheme (plain HTTP). The same boundary applies
    # to X-Forwarded-For so direct clients cannot forge a private client address.
    map "$server_port:$http_x_forwarded_proto" $forwarded_proto {
        default                              $scheme;
{{- if .Values.ingress.enabled }}
        "{{ include "cremind.edgePort" . }}:http"  http;
        "{{ include "cremind.edgePort" . }}:https" https;
{{- end }}
    }

    # Once the Ingress owns HTTPS, plaintext traffic on its private edge
    # listener must reach Cremind's restricted recovery middleware. Without
    # this bit, nginx's /vnc, /websockify and /healthz locations would serve
    # content before the app could refuse plaintext operations. The public
    # Service listener stays outside this path so ordinary HTTP installs keep
    # their full proxy and desktop routes.
    map "$server_port:$forwarded_proto" $edge_plaintext_recovery {
        default                              0;
{{- if include "cremind.ingressHttps" . }}
        "{{ include "cremind.edgePort" . }}:http"  1;
{{- end }}
    }

    # noVNC and its WebSocket are application surfaces too. Divert them on
    # both the private Ingress listener and the public Service listener after
    # edge HTTPS is configured. /healthz uses the narrower map above because
    # kubelet probes the public listener and still needs a sidecar-local check.
    map "$server_port:$forwarded_proto" $plaintext_special_recovery {
        default                              0;
{{- if include "cremind.ingressHttps" . }}
        "{{ .Values.proxy.port }}:http"             1;
        "{{ include "cremind.edgePort" . }}:http"  1;
{{- end }}
    }

{{- $trustedProxyCidrs := .Values.ingress.trustedProxyCidrs | default "" | toString }}
{{- if and .Values.ingress.enabled $trustedProxyCidrs }}

    # Optional strict cluster boundary. `geo` checks the socket peer retained
    # by the realip module; only configured controller addresses may enter the
    # edge listener. real_ip_recursive then derives one client address from the
    # controller's X-Forwarded-For chain instead of forwarding a spoofable chain.
    geo $realip_remote_addr $edge_peer_trusted {
        default 0;
{{ range splitList "," $trustedProxyCidrs }}
        {{ trim . | quote }} 1;
{{ end }}
    }

    map "$server_port:$edge_peer_trusted" $reject_untrusted_edge {
        default 0;
        "{{ include "cremind.edgePort" . }}:0" 1;
    }
{{- end }}

    # $host normalizes away an explicit public port. Preserve the validated
    # HTTP Host header so custom origins (for example https://host:8443) still
    # match APP_URL, CORS and HTTPS handoff tickets exactly.
    map $http_host $forwarded_host {
        default $http_host;
        ''      $host;
    }

    server {
        listen {{ .Values.proxy.port }};
{{- if .Values.ingress.enabled }}
        listen {{ include "cremind.edgePort" . }};
{{- end }}
        server_name _;
{{- if and .Values.ingress.enabled $trustedProxyCidrs }}
{{ range splitList "," $trustedProxyCidrs }}
        set_real_ip_from {{ trim . | quote }};
{{ end }}
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        if ($reject_untrusted_edge) { return 403; }
{{- end }}

        # Emit relative Location headers. With the default (on), nginx expands a
        # redirect into $scheme://$host:{{ .Values.proxy.port }}/… — leaking the
        # internal port and downgrading https to http behind an Ingress. Relative
        # redirects resolve against whatever origin the browser used, so they are
        # correct for both the Ingress host and `port-forward`.
        absolute_redirect off;

        # Proxy-local health for the sidecar's own probes (doesn't depend on
        # the backend being up).
        error_page 418 = @cremind_recovery;
        location = /healthz {
            if ($edge_plaintext_recovery) { return 418; }
            return 200 "ok\n";
        }
{{- if .Values.desktop.enabled }}

        # noVNC desktop viewer (desktop flavor only). websockify serves the
        # noVNC web bundle (relative asset paths, so they resolve under /vnc/)
        # and the VNC WebSocket on :80.
        location = /vnc {
            if ($plaintext_special_recovery) { return 418; }
            return 302 /vnc/vnc.html;
        }
        location /vnc/ {
            if ($plaintext_special_recovery) { return 418; }
            proxy_pass http://127.0.0.1:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $forwarded_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        # noVNC opens its VNC WebSocket at the ROOT path /websockify (its
        # built-in default), not under /vnc/, so it needs its own route to
        # websockify. Without this the upgrade falls through to the app and the
        # viewer reports "Failed to connect to server" (close code 1006).
        location = /websockify {
            if ($plaintext_special_recovery) { return 418; }
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $forwarded_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
{{- end }}

        # Internal redirect target for plaintext requests received through an
        # HTTPS-enabled Ingress. Preserve the original path and trusted
        # forwarding metadata so EdgeTlsRecovery can return its uncached HTML
        # page for navigation and 426/close for APIs and WebSockets.
        location @cremind_recovery {
            proxy_pass http://127.0.0.1:1515;
            proxy_http_version 1.1;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else → the single-origin cremind app on 1515: the SPA,
        # /api (REST + Server-Sent Events + the /api/processes/<pid>/ws
        # WebSocket), /health, /.well-known/agent-card.json, the OAuth callbacks,
        # and the A2A JSON-RPC POST /. Buffering off so SSE streams flow;
        # Upgrade/Connection so the PTY WebSocket and A2A message/stream work.
        location / {
            proxy_pass http://127.0.0.1:1515;
            proxy_http_version 1.1;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
{{- else }}
  nginx.conf: |
    # FULL nginx.conf override — not a conf.d include. The stream{} block below
    # must sit at TOP level (a sibling of http{}), which nothing under
    # /etc/nginx/conf.d/ can provide (conf.d is included inside http{}), so
    # relay mode replaces the whole file. It mirrors the nginx-unprivileged
    # image's own nginx.conf requirements: NO `user` directive (the container
    # already runs as uid 101), pid under /tmp, http temp paths under /tmp (the
    # only guaranteed-writable dirs), logs to the image's stdout/stderr
    # symlinks. The stream module is compiled statically into the official
    # 1.27-alpine binary — no load_module needed.
    #
    # DELIBERATELY omits `include /etc/nginx/conf.d/*.conf;` — the image's stock
    # default.conf listens on {{ .Values.proxy.port }} in the http context and
    # would collide with the stream listener below ("address already in use",
    # container crash-loop).

    # A loopback byte-pump for a single user: one worker is plenty and keeps
    # memory flat (the image default `auto` scales to node cores pointlessly).
    worker_processes  1;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    # Layer-4 TCP passthrough: bytes are relayed untouched, so the app's TLS
    # session (and after-setup's pre-flip plain HTTP) runs end-to-end between
    # the browser and 127.0.0.1:{{ .Values.cremind.uiPort }} — this container
    # never terminates, inspects or re-encrypts anything and holds no
    # certificate material. Its one job is to keep ACCEPTING in-pod dials while
    # the app container restarts (the Setup Wizard's https flip, in-app
    # upgrades): kubectl >= 1.23 kills the whole port-forward tunnel on the
    # first refused dial, and an accepted-then-closed connection is what keeps
    # it alive — the browser just retries.
    stream {
        server {
            listen {{ .Values.proxy.port }};
            proxy_pass 127.0.0.1:{{ .Values.cremind.uiPort }};
            # A loopback connect either succeeds or is refused instantly; the
            # short timeout only bounds the SYN-retry edge while the app
            # container is mid-teardown.
            proxy_connect_timeout 5s;
            # Idle timeout on an ESTABLISHED relay, reset by traffic in either
            # direction — hour-long SSE / WebSocket-over-TLS flows carry
            # keepalives well inside it. Matches the 3600s read/send timeouts
            # the http-mode sidecar uses.
            proxy_timeout 3600s;
        }
    }

    # Minimal http context on a separate pod-internal admin port, solely so the
    # sidecar's own probes stay an httpGet that proves nginx itself is serving.
    # (A tcpSocket probe on the relay port would also pass, but each probe would
    # trigger a spurious upstream dial — error-log noise every period whenever
    # the app is down.)
    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;
        default_type          text/plain;
        # kubelet probes land every few seconds — don't log them.
        access_log            off;

        server {
            listen {{ .Values.proxy.adminPort | default 8081 }};
            server_name _;
            location = /healthz { return 200 "ok\n"; }
        }
    }
{{- end }}
{{- end }}
