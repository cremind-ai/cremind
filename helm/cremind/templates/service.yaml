apiVersion: v1
kind: Service
metadata:
  name: {{ include "cremind.fullname" . }}
  labels:
    {{- include "cremind.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cremind.selectorLabels" . | nindent 4 }}
  {{- $proxyOn := include "cremind.proxyEnabled" . }}
  {{- $relayOn := include "cremind.relayEnabled" . }}
  {{- $sslMode := include "cremind.sslMode" . }}
  {{- $sslOn := ne $sslMode "" }}
  ports:
    # Single entry point. With ssl off the nginx sidecar is an L7 proxy fronting
    # UI + API + noVNC (`http`); with ssl on it is an L4 passthrough relay
    # (`relay`) that keeps port-forwards alive across app restarts while TLS
    # runs end-to-end. Only with proxy.enabled=false does this land directly on
    # the app's own listener (`ui`).
    #
    # The port NAME is steady-state (after-setup ends up on https like auto);
    # it is a label, and renaming it mid-life would break anything selecting on
    # it. appProtocol is NOT: a service mesh reads it as a static claim about
    # the wire protocol and will happily originate TLS / apply L7 policy on the
    # strength of it, so under after-setup — plain HTTP until the Setup Wizard
    # completes — it would mis-handle the whole first phase. Only `auto`, which
    # is TLS from the first byte, gets to make that claim.
    - name: {{ ternary "https" "http" $sslOn }}
      port: {{ .Values.service.port }}
      targetPort: {{ if $proxyOn }}http{{ else if $relayOn }}relay{{ else }}ui{{ end }}
      protocol: TCP
      {{- if eq $sslMode "auto" }}
      appProtocol: https
      {{- end }}
    # Codex OAuth ("Sign in with ChatGPT") callback. Deliberately NOT behind
    # the proxy: OpenAI hard-codes the redirect to http://localhost:1455, so
    # the only way the browser can deliver the code is a port-forward that
    # lands on the backend's own 1455 listener:
    #   kubectl -n <ns> port-forward svc/<name> 1515:80 1455:1455
    # Listed here purely so `port-forward svc/...` can resolve it; nothing
    # routes to it otherwise, and the listener only exists for the ~10 minutes
    # a sign-in is pending. Ingress-only installs must paste the redirect URL
    # (or run `cremind llm codex-oauth login` locally).
    - name: codex-oauth
      port: {{ .Values.cremind.codexCallbackPort }}
      targetPort: {{ .Values.cremind.codexCallbackPort }}
      protocol: TCP
    {{- if and .Values.desktop.enabled (not $proxyOn) }}
    # The /vnc/ route lives in the L7 nginx sidecar — under ssl the sidecar is
    # an L4 relay with no routes at all — so without this the desktop would be
    # unreachable. websockify serves the whole noVNC bundle plus the
    # VNC WebSocket at the root of container port 80, so expose it directly:
    #   kubectl -n <ns> port-forward svc/<name> 6080:6080
    #   -> http://localhost:6080/vnc.html
    # Plain http on its own origin — TLS on the app port does not cover it.
    - name: novnc
      port: 6080
      targetPort: novnc
      protocol: TCP
    {{- end }}
