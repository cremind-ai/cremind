# Pull-request CI for the merged cremind repo.
#
# Three parallel jobs:
#   - ``backend``: lint + pytest against the Python package.
#   - ``ui``: type-check + smoke-build the web SPA bundle.
#   - ``smoke-build``: build the wheel and the Linux Electron .AppImage,
#     and upload both as PR artifacts so reviewers can download and
#     try the build locally without waiting for an RC tag.
#
# The Dockerfile (either target) is intentionally NOT built here. The
# Dockerfile's pip-install RUN bind-mounts the build context at /src, but
# ``.dockerignore`` excludes ``dist/`` (which is correct for prod builds
# that install from a published wheel URL via ``CREMIND_PIP_SPEC``).
# Working around it for a PR-only docker smoke would require either
# editing ``.dockerignore`` (affects prod docker builds) or adding a
# ``--build-context`` slot to the Dockerfile (intrusive). Dockerfile
# breakage surfaces at RC time (release-rc.yml) before merge.
#
# The ``smoke-build`` job skips Windows/macOS matrix builds: code-signing
# secrets aren't available to fork PRs, and the three-OS matrix adds
# ~30 minutes per PR. Platform-specific breakage still surfaces at the
# RC stage (release-rc.yml) before merge — the PR smoke build catches
# the cross-platform majority cheaply.

name: pr

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main so a "bypass PR review" commit
  # (one that didn't go through pull_request) still gets the same
  # checks post-hoc — the installer_tui.pyz staleness guard in the
  # backend job is the load-bearing one. A red main-push run surfaces
  # the defect immediately on the Actions tab even though it can't
  # block the push itself.
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The shell installer downloads a prebuilt installer_tui.pyz that
      # bundles a snapshot of app/upgrade + app/installer. It's a committed
      # binary, so a PR that changes those sources without rebuilding it
      # would silently ship a stale TUI (e.g. missing newer release shapes).
      # This stdlib-only check fails the PR until the pyz is regenerated:
      #   python install/scripts/build_installer_tui.py
      - name: Check installer_tui.pyz is fresh
        run: python install/scripts/build_installer_tui.py --check

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      # ``--ignore=tests/upgrade`` lets the suite stay green while the
      # upgrade fixture matures; drop the flag once those tests are
      # stable. Remove this comment along with the flag.
      - name: Run pytest
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # ui/package.json's prebuild hook shells out to
      # ``python ../scripts/sync_ui_version.py``, so Python must be on PATH.
      - name: Set up Python 3.13 (for prebuild version sync)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      # Linux runner is missing the @rollup/rollup-linux-x64-gnu optional
      # binary because the lockfile was generated on Windows (npm#4828).
      - name: Install Linux Rollup binary (workaround npm#4828)
        run: npm install --no-save --no-package-lock @rollup/rollup-linux-x64-gnu

      - name: Sync version from backend
        run: npm run version:sync

      - name: Type-check
        run: npx vue-tsc --noEmit

      # Smoke-build the web bundle. The full Electron + Docker build
      # lives in the separate ``smoke-build`` job below.
      - name: Smoke build (web)
        run: npm run web:build

  # End-to-end smoke build: wheel + Linux Electron installer + Docker
  # desktop image. Catches packaging breakage (missing data files,
  # broken Dockerfile, electron-builder config rot) before an RC tag is
  # cut. The .AppImage is uploaded as a PR artifact so reviewers can
  # install and try the change locally — the "preview environment"
  # piece of the validate-before-merge flow.
  smoke-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install hatch
        run: pip install --upgrade hatch

      # Build the in-tree ui/ into app/static/ui/ so the wheel bundles
      # the SPA — same step the release workflows run.
      - name: Build SPA
        run: bash scripts/build_ui.sh

      - name: Build wheel + sdist (no publish)
        run: hatch build

      # A gitignore rule that drops a data file leaves every import working
      # and still breaks the app on deploy — that's how the sidecar
      # lockfiles went missing from the wheel and killed Zalo/WhatsApp on
      # Docker/K8S. Cheap to assert here, expensive to find in production.
      - name: Check wheel ships sidecar lockfiles
        run: python scripts/check_wheel_contents.py

      # `npm ci` refuses a lockfile that disagrees with its package.json,
      # so a PR that edits sidecar deps without regenerating the lock would
      # otherwise fail at image-build or boot time instead of here.
      - name: Check sidecar lockfiles are in sync
        run: |
          for d in app/channels/sidecars/*/; do
            if [ -f "$d/package-lock.json" ]; then
              echo "checking $d"
              (cd "$d" && npm ci --dry-run --no-audit --no-fund)
            fi
          done

      # Linux runner is missing @rollup/rollup-linux-x64-gnu (npm#4828).
      - name: Install ui/ deps + Linux Rollup binary
        working-directory: ui
        run: |
          npm ci
          npm install --no-save --no-package-lock @rollup/rollup-linux-x64-gnu

      # ``--mode test`` so __CREMIND_INSTALL_CHANNEL__ bakes in 'test',
      # giving reviewers an installer that targets the test channel
      # rather than masquerading as a production build. ``--publish never``
      # keeps electron-builder from touching GitHub. ``--linux AppImage``
      # restricts to one platform (no signing, no Windows/macOS matrix).
      - name: Build Linux Electron installer (no signing, no publish)
        working-directory: ui
        env:
          GH_TOKEN: ""
        run: npm run build:test -- --publish never --linux AppImage

      - name: Upload PR artifacts (wheel + AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: cremind-pr-${{ github.event.pull_request.number }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            ui/release/**/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # Helm chart validation. Path-gated so backend/UI-only PRs don't take on a
  # dependency on the external chart repos (Bitnami / Qdrant / Chroma) that
  # ``helm dependency build`` pulls from. The render asserts the load-bearing
  # K8s invariants: the mode env vars are present and CREMIND_DB_PROVIDER is
  # NOT templated (setting it would skip the Setup Wizard).
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect helm/ changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            helm:
              - 'helm/**'

      - name: Set up Helm
        if: steps.changes.outputs.helm == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Build deps, lint, and render-guard the chart
        if: steps.changes.outputs.helm == 'true'
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add chromadb https://amikos-tech.github.io/chromadb-chart/
          helm dependency build helm/cremind
          helm lint helm/cremind
          helm template t helm/cremind > /tmp/cremind-render.yaml
          grep -q 'INSTALL_MODE: "kubernetes"' /tmp/cremind-render.yaml \
            || { echo "::error::INSTALL_MODE=kubernetes missing from rendered ConfigMap"; exit 1; }
          grep -q 'SETUP_WIZARD_ENV: "kubernetes"' /tmp/cremind-render.yaml \
            || { echo "::error::SETUP_WIZARD_ENV=kubernetes missing from rendered ConfigMap"; exit 1; }
          # The release channel auto-derives from the image tag: a stable tag
          # (default appVersion) → production; an RC tag → test.
          grep -q 'CREMIND_UPGRADE_CHANNEL: "production"' /tmp/cremind-render.yaml \
            || { echo "::error::default render must report the production channel"; exit 1; }
          helm template t helm/cremind --set image.tag=0.0.2rc1.dev1 \
            | grep -q 'CREMIND_UPGRADE_CHANNEL: "test"' \
            || { echo "::error::an rc image tag must report the test channel"; exit 1; }
          if grep -qE '^[[:space:]]*CREMIND_DB_PROVIDER:' /tmp/cremind-render.yaml; then
            echo "::error::CREMIND_DB_PROVIDER must not be templated — it makes the server skip the Setup Wizard."
            exit 1
          fi
          # ── In-pod TLS (cremind.ssl=auto) ──────────────────────────────
          # Default render stays plain HTTP behind the proxy sidecar.
          if grep -qE '^[[:space:]]*CREMIND_SSL:' /tmp/cremind-render.yaml; then
            echo "::error::the default render must not set CREMIND_SSL"; exit 1
          fi
          grep -q 'nginx-unprivileged' /tmp/cremind-render.yaml \
            || { echo "::error::the default render must include the proxy sidecar"; exit 1; }
          # With ssl off the sidecar is the L7 proxy — an http{} server, no
          # stream{} block. The stream{} presence/absence is what separates
          # the two sidecar modes below; the image name is the same in both.
          if grep -qE '^[[:space:]]*stream \{' /tmp/cremind-render.yaml; then
            echo "::error::the default render must keep the sidecar in L7 proxy mode (no stream{})"; exit 1
          fi
          grep -q 'APP_URL: "http://localhost:1515"' /tmp/cremind-render.yaml \
            || { echo "::error::the default render must derive an http APP_URL"; exit 1; }
          # ssl=auto: env set, https APP_URL, the sidecar switched from the L7
          # plaintext proxy to an L4 stream relay, Service on the relay's port,
          # noVNC given a port of its own (desktop is default).
          helm template t helm/cremind --set cremind.ssl=auto > /tmp/cremind-ssl.yaml
          grep -q 'CREMIND_SSL: "auto"' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto must template CREMIND_SSL"; exit 1; }
          grep -q 'APP_URL: "https://localhost:1515"' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto must auto-derive an https APP_URL"; exit 1; }
          # The sidecar stays under ssl — it keeps a kubectl port-forward alive
          # across app restarts — but it MUST be the L4 passthrough, never the
          # L7 proxy: a stream{} block means bytes are relayed untouched, so the
          # app's TLS runs end-to-end and the sidecar holds no cert material.
          grep -qE '^[[:space:]]*stream \{' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto must run the sidecar as an L4 stream relay"; exit 1; }
          grep -q 'targetPort: relay' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto must point the Service at the relay listener"; exit 1; }
          grep -q 'port: 6080' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto + desktop must expose noVNC on its own port"; exit 1; }
          # The UI cannot tell whether noVNC sits behind the proxy or on its
          # own port, and the OAuth callback is hardcoded http in the skills —
          # so the chart has to state both, scheme-correctly.
          grep -q 'CREMIND_NOVNC_URL: "http://localhost:6080/vnc.html"' /tmp/cremind-ssl.yaml \
            || { echo "::error::ssl=auto must point CREMIND_NOVNC_URL at the noVNC Service port"; exit 1; }
          grep -q 'CREMIND_NOVNC_URL: "http://localhost:1515/vnc/vnc.html"' /tmp/cremind-render.yaml \
            || { echo "::error::the default render must point CREMIND_NOVNC_URL at the proxy route"; exit 1; }
          grep -q 'CREMIND_ATLASSIAN_REDIRECT_URI: "https://localhost:1515/api/oauth/callback"' /tmp/cremind-ssl.yaml \
            || { echo "::error::ssl=auto must default the Atlassian callback to https"; exit 1; }
          if grep -qE '^[[:space:]]*CREMIND_ATLASSIAN_REDIRECT_URI:' /tmp/cremind-render.yaml; then
            echo "::error::the default render must leave the Atlassian callback to the image default"; exit 1
          fi
          helm template t helm/cremind --set cremind.ssl=auto --set desktop.enabled=false \
            > /tmp/cremind-ssl-basic.yaml
          if grep -q 'name: novnc' /tmp/cremind-ssl-basic.yaml; then
            echo "::error::the basic flavor must not expose a noVNC port"; exit 1
          fi
          # The pre-first-class spelling (CREMIND_SSL via extraEnv) must keep
          # rendering, and must drive the same scheme-correct derivations.
          helm template t helm/cremind \
            --set 'cremind.extraEnv[0].name=CREMIND_SSL' \
            --set 'cremind.extraEnv[0].value=auto' \
            | grep -q 'APP_URL: "https://localhost:1515"' \
            || { echo "::error::CREMIND_SSL via extraEnv must still derive an https APP_URL"; exit 1; }
          helm template t helm/cremind --set proxy.enabled=false \
            --set cremind.appUrl=https://localhost:1515 \
            --set 'cremind.extraEnv[0].name=CREMIND_SSL' \
            --set 'cremind.extraEnv[0].value=auto' > /dev/null \
            || { echo "::error::the documented pre-first-class install must still render"; exit 1; }
          # ── Deferred in-pod TLS (cremind.ssl=after-setup) ──────────────
          # Serves plain HTTP until the Setup Wizard completes, then restarts
          # into https. The manifests render the STEADY STATE — same https
          # APP_URL, same L4 relay sidecar, same noVNC port as auto — because
          # that is the origin for the whole life of the install. The probes
          # and appProtocol are the two exceptions; they are pinned below.
          helm template t helm/cremind --set cremind.ssl=after-setup \
            > /tmp/cremind-ssl-after.yaml
          grep -q 'CREMIND_SSL: "after-setup"' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::cremind.ssl=after-setup must template CREMIND_SSL verbatim"; exit 1; }
          grep -q 'APP_URL: "https://localhost:1515"' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::cremind.ssl=after-setup must derive the https steady-state APP_URL"; exit 1; }
          # Relay mode is what makes the flip survivable: the app container
          # restarts into https underneath a sidecar that never restarts, so
          # the port-forward is not torn down mid-flip.
          grep -qE '^[[:space:]]*stream \{' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::cremind.ssl=after-setup must run the sidecar as an L4 stream relay in both phases"; exit 1; }
          grep -q 'targetPort: relay' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::cremind.ssl=after-setup must point the Service at the relay listener"; exit 1; }
          grep -q 'port: 6080' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::cremind.ssl=after-setup + desktop must expose noVNC on its own port"; exit 1; }
          grep -q 'CREMIND_NOVNC_URL: "http://localhost:6080/vnc.html"' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::after-setup must point CREMIND_NOVNC_URL at the noVNC Service port"; exit 1; }
          grep -q 'CREMIND_ATLASSIAN_REDIRECT_URI: "https://localhost:1515/api/oauth/callback"' /tmp/cremind-ssl-after.yaml \
            || { echo "::error::after-setup must default the Atlassian callback to https"; exit 1; }
          # Probes: no httpGet is true in BOTH phases (scheme HTTPS fails
          # against the http listener and would restart-loop the pod before
          # setup finishes; scheme HTTP fails after the flip), so after-setup
          # gets a tcpSocket. auto, TLS from the first byte, keeps httpGet.
          helm template t helm/cremind --set cremind.ssl=after-setup \
            --set readinessProbe.enabled=true > /tmp/cremind-ssl-after-probe.yaml
          grep -q 'tcpSocket' /tmp/cremind-ssl-after-probe.yaml \
            || { echo "::error::after-setup probes must be tcpSocket — true in both phases"; exit 1; }
          if grep -q 'scheme: HTTPS' /tmp/cremind-ssl-after-probe.yaml; then
            echo "::error::after-setup probes must not assert HTTPS — the pre-setup phase is plain HTTP"; exit 1
          fi
          helm template t helm/cremind --set cremind.ssl=auto \
            --set readinessProbe.enabled=true | grep -q 'scheme: HTTPS' \
            || { echo "::error::cremind.ssl=auto probes must keep scheme HTTPS"; exit 1; }
          # appProtocol is a static claim a service mesh enforces, so only
          # `auto` (https from the first byte) may make it.
          if grep -q 'appProtocol: https' /tmp/cremind-ssl-after.yaml; then
            echo "::error::after-setup must not claim appProtocol: https — it serves plain HTTP until setup completes"; exit 1
          fi
          grep -q 'appProtocol: https' /tmp/cremind-ssl.yaml \
            || { echo "::error::cremind.ssl=auto must keep appProtocol: https"; exit 1; }
          # The pre-first-class spelling accepts after-setup too.
          helm template t helm/cremind \
            --set 'cremind.extraEnv[0].name=CREMIND_SSL' \
            --set 'cremind.extraEnv[0].value=after-setup' \
            | grep -q 'APP_URL: "https://localhost:1515"' \
            || { echo "::error::CREMIND_SSL=after-setup via extraEnv must derive the https APP_URL"; exit 1; }
          # Combinations that cannot work must fail the render, not deploy broken.
          for bad in \
            "--set cremind.ssl=auto --set ingress.enabled=true" \
            "--set cremind.ssl=after-setup --set ingress.enabled=true" \
            "--set cremind.ssl=on" \
            "--set cremind.ssl=auto --set cremind.appUrl=http://localhost:1515" \
            "--set cremind.ssl=after-setup --set cremind.appUrl=http://localhost:1515" \
          ; do
            if helm template t helm/cremind $bad > /dev/null 2>&1; then
              echo "::error::helm template should have rejected: $bad"; exit 1
            fi
          done
          echo "Helm chart render guards passed."
